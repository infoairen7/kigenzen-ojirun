# 紀元前おじラン！ online race server — Cloudflare Workers + Durable Objects (works on the free plan)
name = "kigenzen-ojirun-online"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan needs SQLite-backed Durable Objects (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Optional: only let these page origins connect (comma-separated, "*.itch.zone" style wildcards allowed).
# Empty = any page may connect.
ALLOWED_ORIGINS = ""
